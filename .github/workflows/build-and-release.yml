name: Build and Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (x.x.x)
        required: true
        type: string
      notes:
        description: Release notes in Markdown
        required: false
        type: string
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version and check tag
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must be x.x.x"; exit 1; }
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists"; exit 1
          fi

  build:
    needs: validate
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      version: ${{ inputs.version }}

  publish:
    name: Publish v${{ inputs.version }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: RFloor-*
          merge-multiple: true
          path: release-assets
      - name: Release platform packages
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$(find release-assets -type f -print -quit)"
          cd release-assets
          sha256sum RFloor-* > SHA256SUMS.txt
          cd ..
          if [[ -n "$NOTES" ]]; then
            printf '%s\n\n' "$NOTES" > release-notes.md
          fi
          printf '%s\n' 'Packages include .NET and iperf3. See SHA256SUMS.txt for package checksums.' >> release-notes.md
          gh release create "v$VERSION" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "RFloor v$VERSION" \
            --notes-file release-notes.md
